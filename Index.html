<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>English Practice · Listening y Pronunciación</title>
<style>
:root{
  --bg:#eef3fb;--card:#ffffff;--fg:#0f1f3a;--mut:#5a6b86;--line:#d6e1f1;
  --acc:#1456c8;--acc-d:#0b3b91;--accfg:#ffffff;--acc2:#e7f0fe;--acc3:#cfe0fc;
  --ok:#15803d;--okbg:#e6f6ec;--bad:#c62828;--badbg:#fdecec;--warn:#eaf2ff;--warnb:#b9d0f5;
  --pink:#dbe8fd;--green:#bcd4fb;--blue:#9cc0f8;--shadow:0 1px 2px rgba(15,40,90,.06),0 6px 18px rgba(15,40,90,.07);
  --hero:linear-gradient(135deg,#0a2a6b 0%,#1456c8 55%,#2f80ed 100%);
  --radius:16px;
}
:root[data-theme=dark]{
  --bg:#0b1426;--card:#121e36;--fg:#e8eefb;--mut:#9db0d0;--line:#243556;
  --acc:#5aa2ff;--acc-d:#3b82f6;--accfg:#06142b;--acc2:#162a4d;--acc3:#1d3a6b;
  --ok:#4ade80;--okbg:#0f2a1d;--bad:#ff8a8a;--badbg:#341a1f;--warn:#13264a;--warnb:#27457c;
  --pink:#1c3566;--green:#24457f;--blue:#2d5599;--shadow:none;
  --hero:linear-gradient(135deg,#0a1f4d 0%,#123c91 55%,#1d5fd1 100%);
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Segoe UI Variable","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;background:var(--bg);color:var(--fg);line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid #7db2ff;outline-offset:2px}

/* ---------- ENCABEZADO ---------- */
header.top{background:var(--hero);color:#fff;position:sticky;top:0;z-index:20;box-shadow:0 4px 18px rgba(10,42,107,.28)}
.topin{max-width:1120px;margin:0 auto;padding:12px 16px 6px;display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;letter-spacing:.2px;color:#fff}
.logo .lg{width:36px;height:36px;border-radius:10px;background:#fff;color:var(--acc-d);display:grid;place-items:center;font-size:15px;font-weight:900;letter-spacing:-.5px;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.logo em{font-style:normal;font-weight:500;opacity:.85}
.sp{flex:1}
.stat{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);color:#fff;border-radius:999px;padding:5px 13px;font-size:13px;font-weight:600;white-space:nowrap;backdrop-filter:blur(4px)}
.setbar{max-width:1120px;margin:0 auto;padding:4px 16px 10px;display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;font-size:13px}
.setbar label{display:flex;align-items:center;gap:6px;color:rgba(255,255,255,.85)}
.setbar select,.setbar input[type=range]{max-width:200px}
.setbar select{background:rgba(255,255,255,.95);color:#0f1f3a;border:0;border-radius:8px;padding:5px 8px}
.setbar input[type=range]{accent-color:#fff}
.setbar .btn{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.28)}
.setbar .btn:hover{background:rgba(255,255,255,.24);border-color:#fff}
nav.tabs{max-width:1120px;margin:0 auto;display:flex;gap:4px;overflow-x:auto;padding:0 16px;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{white-space:nowrap;border:0;background:transparent;color:rgba(255,255,255,.82);border-radius:10px 10px 0 0;padding:10px 15px;font-weight:600;font-size:14px;border-bottom:3px solid transparent;transition:background .12s}
nav.tabs button:hover{background:rgba(255,255,255,.12);color:#fff}
nav.tabs button[aria-current=page]{background:var(--bg);color:var(--acc-d);border-bottom-color:var(--bg)}
:root[data-theme=dark] nav.tabs button[aria-current=page]{color:var(--acc)}

main{max-width:1120px;margin:0 auto;padding:22px 16px 70px}
h2{margin:0 0 4px;font-size:28px;letter-spacing:-.3px;color:var(--acc-d)}
:root[data-theme=dark] h2{color:#fff}
h3{margin:26px 0 12px;font-size:17px;letter-spacing:.1px;display:flex;align-items:center;gap:8px;color:var(--fg)}
h3::after{content:"";flex:1;height:1px;background:var(--line)}
.muted{color:var(--mut)}
small{color:var(--mut)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);margin:12px 0}

/* ---------- PORTADA ---------- */
.hero{background:var(--hero);color:#fff;border-radius:22px;padding:28px;display:grid;grid-template-columns:1.4fr 1fr;gap:22px;align-items:center;box-shadow:0 14px 34px rgba(20,86,200,.28);position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;right:-70px;top:-70px;width:260px;height:260px;border-radius:50%;background:rgba(255,255,255,.08)}
.hero::after{content:"";position:absolute;right:90px;bottom:-110px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.06)}
.hero>*{position:relative;z-index:1}
.hero h1{margin:0 0 8px;font-size:32px;line-height:1.15;letter-spacing:-.5px}
.hero p{margin:0 0 18px;opacity:.9;max-width:520px}
.hero .cta{display:flex;flex-wrap:wrap;gap:10px}
.hero .btn.w{background:#fff;color:var(--acc-d);border-color:#fff}
.hero .btn.w:hover{background:#e7f0fe}
.hero .btn.o{background:transparent;color:#fff;border-color:rgba(255,255,255,.55)}
.hero .btn.o:hover{background:rgba(255,255,255,.14);border-color:#fff}
.hstats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.hs{background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.22);border-radius:14px;padding:12px 8px;text-align:center}
.hs b{display:block;font-size:26px;line-height:1.1}
.hs span{font-size:12px;opacity:.85}
.minibar{grid-column:1/-1;margin-top:2px}
.minibar .lbl{display:flex;justify-content:space-between;font-size:12px;opacity:.9;margin-bottom:4px}
.minibar .t{height:8px;background:rgba(255,255,255,.2);border-radius:99px;overflow:hidden}
.minibar .t div{height:100%;background:#fff;border-radius:99px}
@media(max-width:760px){.hero{grid-template-columns:1fr;padding:22px}.hero h1{font-size:26px}}

/* ---------- TARJETAS ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;text-align:left;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:5px;transition:transform .12s,box-shadow .12s,border-color .12s;position:relative;overflow:hidden}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(180deg,#2f80ed,#0a2a6b);opacity:0;transition:opacity .12s}
.card:hover{transform:translateY(-3px);border-color:var(--acc);box-shadow:0 10px 26px rgba(20,86,200,.18)}
.card:hover::before{opacity:1}
.card .ic{width:46px;height:46px;border-radius:13px;background:var(--acc2);display:grid;place-items:center;font-size:24px;margin-bottom:6px}
.card b{font-size:16px;color:var(--fg)}
.card span.d{color:var(--mut);font-size:13px}
.card .go{margin-top:auto;color:var(--acc);font-weight:700;font-size:13px;padding-top:8px}

/* ---------- BOTONES ---------- */
.btn{border:1px solid var(--line);background:var(--card);border-radius:11px;padding:9px 15px;font-weight:600;transition:background .12s,border-color .12s,transform .06s;color:var(--fg)}
.btn:hover{border-color:var(--acc);background:var(--acc2)}
.btn:active{transform:scale(.98)}
.btn.pri,.btn.big{background:linear-gradient(180deg,#2a72e0,#1456c8);color:#fff;border-color:#1456c8;box-shadow:0 2px 8px rgba(20,86,200,.3)}
.btn.pri:hover,.btn.big:hover{background:linear-gradient(180deg,#3b82f0,#1a63df);border-color:#1a63df}
.btn.sm{padding:5px 11px;font-size:13px;border-radius:9px}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.55;cursor:default}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--acc2);color:var(--acc-d);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:700}
:root[data-theme=dark] .chip{color:var(--acc)}
.chips button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;font-weight:600;font-size:13px}
.chips button:hover{border-color:var(--acc)}
.chips button.on{background:var(--acc);color:var(--accfg);border-color:var(--acc)}
select,input[type=text],input[type=number],textarea{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 11px;color:var(--fg)}
input[type=text]:focus,input[type=number]:focus,textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(20,86,200,.18);outline:none}

/* ---------- ALFABETO ---------- */
.abcrow{display:flex;flex-wrap:wrap;gap:9px;margin:9px 0}
.tile{width:74px;height:80px;border:0;border-radius:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--fg);box-shadow:inset 0 -3px 0 rgba(10,42,107,.12);transition:transform .1s}
.tile b{font-size:27px;font-family:Arial,sans-serif;font-weight:600;color:var(--acc-d)}
:root[data-theme=dark] .tile b{color:#fff}
.tile i{font-size:13px;font-weight:700;color:var(--mut)}
.tile.pink{background:var(--pink)}.tile.green{background:var(--green)}.tile.blue{background:var(--blue)}
.tile:hover{transform:translateY(-3px) scale(1.04);filter:brightness(.97)}
.spellout{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.spellout div{background:var(--acc2);border-radius:9px;padding:6px 10px;text-align:center;min-width:46px}
.spellout b{display:block;font-size:20px;color:var(--acc-d)}
:root[data-theme=dark] .spellout b{color:#fff}
.spellout i{font-size:12px;color:var(--mut)}

/* ---------- TABLAS Y LISTAS ---------- */
table{border-collapse:separate;border-spacing:0;width:100%;font-size:15px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
th,td{border-bottom:1px solid var(--line);padding:10px 12px;text-align:left}
tr:last-child td,tr:last-child th{border-bottom:0}
th{background:var(--acc2);color:var(--acc-d);font-size:14px}
:root[data-theme=dark] th{color:#fff}
.say{cursor:pointer;border-bottom:1px dashed var(--acc);color:var(--acc);font-weight:600}
.say:hover{background:var(--acc2)}
.natrow{display:grid;grid-template-columns:1.4fr 1.2fr auto;gap:8px;align-items:center;padding:9px 6px;border-bottom:1px solid var(--line)}
.natrow:hover{background:var(--acc2);border-radius:10px}
.natn{font-weight:700;font-size:17px}
.natn u{text-decoration:none;color:#fff;background:var(--acc);border-radius:5px;padding:0 4px;margin-left:1px}
.tilegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(125px,1fr));gap:10px}
.vt{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:98px;box-shadow:var(--shadow);transition:transform .1s,border-color .1s}
.vt:hover{border-color:var(--acc);background:var(--acc2);transform:translateY(-2px)}
.vt .em{font-size:32px}
.vt b{font-size:15px}.vt small{font-size:12px}
.sw{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);display:inline-block}
.numgrid{display:flex;flex-wrap:wrap;gap:7px}
.numgrid button{min-width:48px;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:7px 9px;font-weight:700}
.numgrid button:hover{background:var(--acc);color:var(--accfg);border-color:var(--acc)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:700px){.two{grid-template-columns:1fr}.natrow{grid-template-columns:1fr auto}.natn{grid-column:1}}
.wordchip{display:inline-block;margin:3px;padding:6px 13px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-weight:600}
.wordchip:hover{background:var(--acc2);border-color:var(--acc)}
.wordchip.long{border-color:var(--acc);background:var(--acc2)}

/* ---------- PRUEBAS ---------- */
.qcard{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:var(--shadow);max-width:840px;margin:0 auto}
.qhead{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.qnum{font-weight:700;color:var(--mut)}.qscore{font-weight:800;color:var(--ok)}
.bar{height:10px;background:var(--acc2);border-radius:99px;margin:14px 0;overflow:hidden}
.bar div{height:100%;background:linear-gradient(90deg,#2f80ed,#0a2a6b);border-radius:99px;transition:width .3s}
.qprompt{font-size:20px;margin:12px 0;font-weight:600}
.qprompt .big{display:block;font-size:30px;margin-top:8px;color:var(--acc-d)}
:root[data-theme=dark] .qprompt .big{color:#fff}
.arow{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 14px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:11px}
.opt{border:2px solid var(--line);background:var(--card);border-radius:14px;padding:14px 12px;font-weight:700;font-size:17px;text-align:center;display:flex;align-items:center;justify-content:center;gap:10px;min-height:58px;transition:border-color .1s,background .1s,transform .06s}
.opt:hover:not([disabled]){border-color:var(--acc);background:var(--acc2);transform:translateY(-1px)}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.bad{border-color:var(--bad);background:var(--badbg)}
.opt[disabled]{cursor:default}
.opt .sw{width:30px;height:30px}
.typerow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.typerow input{flex:1;min-width:200px;font-size:19px;padding:12px 14px}
.hint{font-size:13px;color:var(--mut);margin-top:6px}
.fb{margin-top:16px;border-radius:14px;padding:0}
.fb.ok,.fb.bad{padding:13px 16px}
.fb.ok{background:var(--okbg);border:1px solid var(--ok)}
.fb.bad{background:var(--badbg);border:1px solid var(--bad)}
.nextrow{margin-top:14px;display:flex;justify-content:flex-end}
.bank,.ans{display:flex;flex-wrap:wrap;gap:8px;min-height:54px;padding:9px;border-radius:14px;margin:9px 0}
.ans{border:2px dashed var(--acc3);background:var(--acc2)}
.bank button,.ans button{border:1px solid var(--acc);background:var(--card);border-radius:11px;padding:9px 14px;font-weight:700;font-size:17px;color:var(--acc-d);box-shadow:0 2px 0 var(--acc3)}
:root[data-theme=dark] .bank button,:root[data-theme=dark] .ans button{color:#fff}
.target{font-size:32px;font-weight:800;text-align:center;margin:12px 0;line-height:1.25;color:var(--acc-d)}
:root[data-theme=dark] .target{color:#fff}
.target .w-ok{color:var(--ok)}.target .w-bad{color:var(--bad);text-decoration:underline wavy}
.heard{text-align:center;color:var(--mut);margin:4px 0}
.micbtn{background:linear-gradient(180deg,#1f6be0,#0b3b91);color:#fff;border-color:#0b3b91;font-size:18px;padding:13px 24px;border-radius:999px;box-shadow:0 4px 14px rgba(11,59,145,.4)}
.micbtn:hover{background:linear-gradient(180deg,#2f80ed,#0f48ad);border-color:#0f48ad}
.micbtn.live{animation:pulse 1s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(47,128,237,.6)}100%{box-shadow:0 0 0 18px rgba(47,128,237,0)}}
.center{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:12px 0;align-items:center}
.notice{background:var(--warn);border:1px solid var(--warnb);border-left:4px solid var(--acc);border-radius:10px;padding:11px 14px;font-size:14px;margin:12px 0}
.result{text-align:center}
.result .score{font-size:64px;font-weight:800;background:linear-gradient(135deg,#2f80ed,#0a2a6b);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.1;margin:6px 0}
:root[data-theme=dark] .result .score{background:linear-gradient(135deg,#8cc0ff,#fff);-webkit-background-clip:text;background-clip:text}
.wronglist{text-align:left;margin-top:14px}
.wronglist div{border-bottom:1px solid var(--line);padding:8px 0}
.pbar{display:grid;grid-template-columns:160px 1fr 100px;gap:12px;align-items:center;margin:10px 0}
.pbar .t{height:12px;background:var(--acc2);border-radius:99px;overflow:hidden}
.pbar .t div{height:100%;background:linear-gradient(90deg,#2f80ed,#0a2a6b);border-radius:99px}
.flash{border:2px solid var(--acc);border-radius:20px;padding:28px 14px;text-align:center;background:linear-gradient(180deg,var(--acc2),var(--card));min-height:160px;display:flex;flex-direction:column;justify-content:center;gap:6px}
.flash .f1{font-size:32px;font-weight:800;color:var(--acc-d)}
:root[data-theme=dark] .flash .f1{color:#fff}
details{margin:8px 0}
summary{cursor:pointer;font-weight:600;color:var(--acc)}
textarea{width:100%;min-height:76px;font-size:18px}
.pill{font-size:12px;background:var(--acc2);padding:2px 8px;border-radius:99px;margin-left:6px}
@media(max-width:700px){header.top{position:static}}
.foot{text-align:center;color:var(--mut);font-size:12px;margin-top:40px}
</style>
</head>
<body>
<header class="top">
  <div class="topin">
    <div class="logo"><span class="lg" aria-hidden="true">EP</span><span>English <em>Practice</em></span></div>
    <div class="sp"></div>
    <div class="stat" id="stXP">⭐ 0 XP</div>
    <div class="stat" id="stStreak">🔥 Racha 0</div>
    <div class="stat" id="stLevel">Nivel 1</div>
  </div>
  <div class="setbar">
    <label>Voz <select id="voiceSel" aria-label="Voz en inglés"></select></label>
    <label>Velocidad <input id="rate" type="range" min="0.5" max="1.2" step="0.05" value="0.9" aria-label="Velocidad de la voz"> <span id="rateVal">0.90</span></label>
    <label>Preguntas por prueba
      <select id="qn"><option>5</option><option>10</option><option>15</option><option>20</option></select>
    </label>
    <button class="btn sm" id="testVoice" type="button">🔊 Probar voz</button>
    <button class="btn sm" id="themeBtn" type="button">🌙 / ☀️</button>
  </div>
  <nav class="tabs" id="tabs" aria-label="Secciones"></nav>
</header>
<main id="view"></main>

<script>
(function(){
'use strict';
/* ============================================================
   UTILIDADES
   ============================================================ */
var KEY='englishPractice_v1';
function $(s,r){return (r||document).querySelector(s);}
function h(tag,props){
  var e=document.createElement(tag);
  if(props){for(var k in props){var v=props[k];
    if(k==='class')e.className=v;
    else if(k==='html')e.innerHTML=v;
    else if(k.slice(0,2)==='on')e.addEventListener(k.slice(2),v);
    else if(v!==false&&v!=null)e.setAttribute(k,v);}}
  var kids=Array.prototype.slice.call(arguments,2);
  (function add(list){list.forEach(function(c){
    if(c==null||c===false)return;
    if(Array.isArray(c))return add(c);
    e.append(c.nodeType?c:document.createTextNode(String(c)));});})(kids);
  return e;
}
function rnd(n){return Math.floor(Math.random()*n);}
function pick(a){return a[rnd(a.length)];}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=rnd(i+1);var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function uniq(a){return a.filter(function(x,i){return a.indexOf(x)===i;});}
function sample(a,n){return shuffle(a).slice(0,n);}
function mcOpts(correct,pool,n){
  n=n||4;
  var wrong=sample(uniq(pool).filter(function(x){return x!==correct;}),n-1);
  return shuffle([correct].concat(wrong));
}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1);}
function sleep(ms){return new Promise(function(r){setTimeout(r,ms);});}
function aOrAn(w){return /^[aeiou]/i.test(w)?'an':'a';}

/* ============================================================
   ESTADO (se guarda en el navegador)
   ============================================================ */
var S={stats:{},xp:0,streak:0,best:0,mistakes:[],rate:0.9,voice:'',qn:10,theme:''};
try{var saved=JSON.parse(localStorage.getItem(KEY)||'{}');for(var k in saved)S[k]=saved[k];}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}

var TOPICS={
  alphabet:'Alfabeto',listening:'Listening',pron:'Pronunciación',nat:'Nacionalidades',
  numbers:'Números',vowels:'Vocales',be:'Verbo BE',poss:'Posesivos',simple:'Present Simple',vocab:'Vocabulario'
};

/* ============================================================
   DATOS
   ============================================================ */

var ONES=['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'];
var TENS=['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'];
function numWords(n){
  n=Math.floor(n);
  if(n<20)return ONES[n];
  if(n<100){var o=n%10;return TENS[Math.floor(n/10)]+(o?'-'+ONES[o]:'');}
  if(n<1000){var r=n%100;return ONES[Math.floor(n/100)]+' hundred'+(r?' and '+numWords(r):'');}
  if(n===1000)return 'one thousand';
  return String(n);
}
var STRESS_TEEN={13:'thir-TEEN',14:'four-TEEN',15:'fif-TEEN',16:'six-TEEN',17:'seven-TEEN',18:'eigh-TEEN',19:'nine-TEEN'};
var STRESS_TY={30:'THIR-ty',40:'FOR-ty',50:'FIF-ty',60:'SIX-ty',70:'SEV-en-ty',80:'EIGH-ty',90:'NINE-ty'};

/* ============================================================
   NORMALIZACION Y COMPARACION
   ============================================================ */
function expand(s){
  return s.replace(/[’‘]/g,"'")
    .replace(/\bi'm\b/g,'i am')
    .replace(/\b(you|we|they)'re\b/g,'$1 are')
    .replace(/\b(he|she|it|that|there|what|who)'s\b/g,'$1 is')
    .replace(/\b(is|are|was|were|do|does|did)n't\b/g,'$1 not')
    .replace(/\bcan't\b/g,'can not');
}
function normText(s,mode){
  s=expand(String(s).toLowerCase().trim());
  s=s.replace(/\d+/g,function(m){return ' '+numWords(+m)+' ';});
  s=s.replace(/[^a-z' ]/g,' ').replace(/\s+/g,' ').trim();
  if(mode==='num')s=(' '+s+' ').replace(/ and /g,' ').trim();
  return s;
}
function checkType(q,val){
  val=String(val||'').trim();
  if(!val)return false;
  if(q.cmp==='letters'){var f=function(x){return x.toLowerCase().replace(/[^a-z0-9]/g,'');};return f(val)===f(q.answer);}
  if(q.cmp==='email'){return val.toLowerCase().replace(/\s+/g,'')===q.answer.toLowerCase();}
  var acc=[q.answer].concat(q.accept||[]);
  var m=q.cmp==='num'?'num':'';
  var nv=normText(val,m);
  return acc.some(function(a){return normText(a,m)===nv;});
}
function lev(a,b){
  var m=a.length,n=b.length,d=[],i,j;
  for(i=0;i<=m;i++){d[i]=[i];}
  for(j=1;j<=n;j++){d[0][j]=j;}
  for(i=1;i<=m;i++)for(j=1;j<=n;j++){
    d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
  }
  return d[m][n];
}
function sim(a,b){var L=Math.max(a.length,b.length);return L?1-lev(a,b)/L:1;}
function tokens(s){return normText(s,'num').split(' ').filter(Boolean);}
function scoreSpeech(target,alts,accept){
  var tt=tokens(target),best={score:0,marks:tt.map(function(w){return {w:w,ok:false};}),heard:alts[0]||''};
  for(var a=0;a<alts.length;a++){
    var alt=alts[a],ht=tokens(alt);
    if(accept&&accept.length){
      var joined=ht.join(' ');
      if(accept.indexOf(joined)>-1||ht.some(function(x){return accept.indexOf(x)>-1;})){
        return {score:1,marks:tt.map(function(w){return {w:w,ok:true};}),heard:alt};
      }
    }
    var used={},marks=[],ok=0;
    tt.forEach(function(w){
      var bi=-1,bs=0;
      ht.forEach(function(x,i){if(used[i])return;var s=sim(w,x);if(s>bs){bs=s;bi=i;}});
      if(bi>-1&&bs>=0.72){used[bi]=true;ok++;marks.push({w:w,ok:true});}else marks.push({w:w,ok:false});
    });
    var sc=tt.length?ok/tt.length:0;
    if(sc>best.score||a===0&&sc>=best.score){best={score:sc,marks:marks,heard:alt};}
  }
  return best;
}

   AUDIO (voz del navegador) Y MICROFONO
   ============================================================ */
var TTS=('speechSynthesis' in window)&&('SpeechSynthesisUtterance' in window);
var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
var voices=[];
function loadVoices(){
  if(!TTS)return;
  voices=speechSynthesis.getVoices().filter(function(v){return /^en/i.test(v.lang);});
  var sel=$('#voiceSel');sel.innerHTML='';
  if(!voices.length){sel.append(h('option',{value:''},'Voz predeterminada'));return;}
  voices.forEach(function(v){sel.append(h('option',{value:v.name},v.name+' ('+v.lang+')'));});
  var cur=voices.filter(function(v){return v.name===S.voice;})[0];
  if(!cur){
    cur=voices.filter(function(v){return /natural|online/i.test(v.name)&&/en-US/i.test(v.lang);})[0]||
        voices.filter(function(v){return /en[-_]US/i.test(v.lang);})[0]||voices[0];
  }
  sel.value=cur.name;S.voice=cur.name;
}
function curVoice(){return voices.filter(function(v){return v.name===S.voice;})[0]||null;}
function say(text,rate){
  return new Promise(function(res){
    if(!TTS){res();return;}
    var u=new SpeechSynthesisUtterance(text);
    u.lang='en-US';var v=curVoice();if(v){u.voice=v;u.lang=v.lang;}
    u.rate=rate||S.rate;
    u.onend=u.onerror=function(){res();};
    speechSynthesis.speak(u);
  });
}
function spellTokens(str){
  var out=[];
  str.split('').forEach(function(ch){
    var U=ch.toUpperCase();
    if(SAY_LETTER[U]&&/[a-z]/i.test(ch))out.push(SAY_LETTER[U]);
    else if(/\d/.test(ch))out.push(ONES[+ch]);
    else if(ch==='.')out.push('dot');
    else if(ch==='@')out.push('at');
    else if(ch==='-')out.push('dash');
    else if(ch==='_')out.push('underscore');
    else if(ch===' ')out.push(null);
  });
  return out;
}
var playTok=0;
async function playAudio(a,slow){
  if(!a)return;
  if(!TTS){toast('Tu navegador no tiene voz integrada. Prueba con Chrome o Edge.');return;}
  var t=++playTok;
  speechSynthesis.cancel();
  await sleep(70);
  var rate=slow?Math.min(0.6,S.rate):S.rate;
  if(a.text){await say(a.text,rate);return;}
  if(a.spell){
    var tk=spellTokens(a.spell);
    for(var i=0;i<tk.length;i++){
      if(t!==playTok)return;
      if(tk[i]===null){await sleep(500);continue;}
      await say(tk[i],rate);
      await sleep(slow?520:300);
    }
  }
}
function stopAll(){playTok++;if(TTS)speechSynthesis.cancel();if(curRec){try{curRec.abort();}catch(e){}}}
var curRec=null;
function listenOnce(){
  return new Promise(function(resolve,reject){
    var r=new SR();curRec=r;
    r.lang='en-US';r.maxAlternatives=5;r.interimResults=false;r.continuous=false;
    var done=false;
    r.onresult=function(e){
      done=true;var alts=[];
      for(var i=0;i<e.results[0].length;i++)alts.push(e.results[0][i].transcript);
      resolve(alts);
    };
    r.onerror=function(e){if(!done){done=true;reject(e.error||'error');}};
    r.onnomatch=function(){if(!done){done=true;reject('no-speech');}};
    r.onend=function(){if(!done){done=true;reject('no-speech');}};
    try{r.start();}catch(e){reject('error');}
  });
}
var toastTimer;
function toast(msg){
  var t=$('#toast');
  if(!t){t=h('div',{id:'toast',style:'position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#0a2a6b;color:#fff;padding:10px 16px;border-radius:10px;z-index:99;max-width:90%;font-size:14px'});document.body.append(t);}
  t.textContent=msg;t.style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.style.display='none';},3500);
}

function letterDistractors(L){
  var g=[];CONFUS.forEach(function(x){if(x.indexOf(L)>-1)g=g.concat(x);});
  g=uniq(g).filter(function(x){return x!==L;});
  var base=shuffle(g).slice(0,3);
  while(base.length<3){var c=pick(ALPHA);if(c!==L&&base.indexOf(c)<0)base.push(c);}
  return base;
}
function speakQ(target,es,extra){
  var q={kind:'speak',prompt:'Escucha el modelo y <b>repítelo en voz alta</b>.',target:target,es:es||'',answer:target};
  if(extra)for(var k in extra)q[k]=extra[k];
  return q;
}

var sess=null;
function qKey(q){return JSON.stringify([q.prompt,q.answer,q.target||'',q.audio||'']);}
function startQuiz(id,opts){
  opts=opts||{};
  stopAll();
  var d=QZ[id]||{id:id,icon:opts.icon||'🎯',title:opts.title||'Prueba',topic:'vocab',gen:opts.gen};
  var n=opts.n||parseInt(S.qn,10)||10,qs=[],seen={},tries=0;
  if(opts.list){qs=opts.list.slice(0,n);}
  else{
    while(qs.length<n&&tries<n*25){
      tries++;
      var q=(d.gen||opts.gen)();
      if(!q)continue;
      q.topic=q.topic||d.topic;
      var k=qKey(q);
      if(seen[k])continue;
      seen[k]=1;qs.push(q);
    }
  }
  if(!qs.length){toast('No hay preguntas disponibles.');return;}
  sess={id:id,title:opts.title||d.title,icon:opts.icon||d.icon,qs:qs,i:0,score:0,wrong:[],back:opts.back||'home',review:!!opts.review};
  renderQ();
  window.scrollTo(0,0);
}
function record(q,ok){
  var t=q.topic||'vocab';
  S.stats[t]=S.stats[t]||{c:0,t:0};
  S.stats[t].t++;
  if(ok){S.stats[t].c++;S.streak++;S.best=Math.max(S.best,S.streak);S.xp+=10+Math.min(S.streak,5);}
  else S.streak=0;
  var k=qKey(q);
  if(!ok){
    if(!S.mistakes.some(function(m){return qKey(m)===k;})){S.mistakes.push(q);if(S.mistakes.length>80)S.mistakes.shift();}
  }else if(sess&&sess.review){S.mistakes=S.mistakes.filter(function(m){return qKey(m)!==k;});}
  save();renderStats();
}
function renderStats(){
  $('#stXP').textContent='⭐ '+S.xp+' XP';
  $('#stStreak').textContent='🔥 Racha '+S.streak;
  $('#stLevel').textContent='Nivel '+(Math.floor(S.xp/200)+1);
}

function renderQ(){
  var q=sess.qs[sess.i],answered=false,attempts=0;
  var v=$('#view');v.innerHTML='';
  var wrap=h('div',{class:'qcard'});
  wrap.append(h('div',{class:'qhead'},
    h('button',{class:'btn ghost sm',type:'button',onclick:function(){stopAll();go(sess.back);}},'← Salir'),
    h('span',{class:'chip'},sess.icon+' '+sess.title),
    h('span',{class:'sp'}),
    h('span',{class:'qnum'},(sess.i+1)+' / '+sess.qs.length),
    h('span',{class:'qscore'},'✔ '+sess.score)));
  wrap.append(h('div',{class:'bar'},h('div',{style:'width:'+(sess.i/sess.qs.length*100)+'%'})));
  wrap.append(h('div',{class:'qprompt',html:q.prompt}));
  if(q.audio){
    wrap.append(h('div',{class:'arow'},
      h('button',{class:'btn big',type:'button',onclick:function(){playAudio(q.audio);}},'🔊 Escuchar'),
      h('button',{class:'btn',type:'button',onclick:function(){playAudio(q.audio,true);}},'🐢 Más lento')));
    setTimeout(function(){if(sess&&sess.qs[sess.i]===q)playAudio(q.audio);},300);
  }
  var body=h('div',{class:'qbody'});wrap.append(body);
  var fb=h('div',{class:'fb','aria-live':'polite'});wrap.append(fb);
  var last=sess.i===sess.qs.length-1;
  var nxt=h('button',{class:'btn pri',type:'button',onclick:function(){stopAll();if(last)renderResult();else{sess.i++;renderQ();}}},last?'Ver resultados ✓':'Siguiente →');
  nxt.hidden=true;
  wrap.append(h('div',{class:'nextrow'},nxt));
  v.append(wrap);

  function finish(ok,shown){
    if(answered)return;answered=true;
    if(ok)sess.score++;else sess.wrong.push(q);
    record(q,ok);
    var ans=q.kind==='speak'?q.target:q.answer;
    fb.className='fb '+(ok?'ok':'bad');
    fb.innerHTML=(ok?'✅ <b>¡Correcto!</b>':'❌ <b>Incorrecto.</b> Respuesta: <b>'+ans+'</b>')+(shown?'<div class="hint">Tu respuesta: '+shown+'</div>':'')+(q.explain?'<div style="margin-top:6px">'+q.explain+'</div>':'');
    nxt.hidden=false;setTimeout(function(){nxt.focus();},250);
    wrap.querySelector('.qscore').textContent='✔ '+sess.score;
  }

  if(q.kind==='mc'){
    var opts=h('div',{class:'opts',role:'group'});
    q.options.forEach(function(o,idx){
      var isObj=typeof o==='object',val=isObj?o.value:o;
      var b=h('button',{class:'opt',type:'button','aria-label':isObj?('Color '+(idx+1)):val},
        isObj?h('span',{class:'sw',style:'width:44px;height:44px;background:'+o.color}):null,
        isObj?null:val);
      b.dataset.v=val;
      b.addEventListener('click',function(){
        if(answered)return;
        var ok=val===q.answer;
        Array.prototype.forEach.call(opts.children,function(x){x.disabled=true;if(x.dataset.v===q.answer)x.classList.add('ok');});
        if(!ok)b.classList.add('bad');
        finish(ok,isObj?val:null);
      });
      opts.append(b);
    });
    body.append(opts);
    if(q.options.length<=5)body.append(h('div',{class:'hint'},'Tip: puedes usar las teclas 1–'+q.options.length+'.'));
    sess.keys=function(e){
      var n=parseInt(e.key,10);
      if(!answered&&n>=1&&n<=q.options.length&&opts.children[n-1])opts.children[n-1].click();
    };
  }
  else if(q.kind==='type'){
    var inp=h('input',{type:'text',autocomplete:'off',autocapitalize:'none',spellcheck:'false','aria-label':'Tu respuesta',placeholder:'Escribe aquí…'});
    var chk=h('button',{class:'btn pri',type:'button'},'Comprobar');
    var skip=h('button',{class:'btn ghost',type:'button'},'No sé');
    function submit(){if(answered)return;var val=inp.value;if(!val.trim()){inp.focus();return;}var ok=checkType(q,val);inp.disabled=true;chk.disabled=true;skip.disabled=true;finish(ok,val);}
    chk.addEventListener('click',submit);
    skip.addEventListener('click',function(){if(answered)return;inp.disabled=true;chk.disabled=true;skip.disabled=true;finish(false,'(sin respuesta)');});
    inp.addEventListener('keydown',function(e){if(e.key==='Enter')submit();});
    body.append(h('div',{class:'typerow'},inp,chk,skip));
    if(q.hint)body.append(h('div',{class:'hint'},'💡 '+q.hint));
    setTimeout(function(){inp.focus();},50);
    sess.keys=null;
  }
  else if(q.kind==='order'){
    var bank=h('div',{class:'bank'}),ans=h('div',{class:'ans'});
    var items=q.words.map(function(w,i){return {w:w,i:i,placed:false};});
    function draw(){
      bank.innerHTML='';ans.innerHTML='';
      var placed=items.filter(function(x){return x.placed;}).sort(function(a,b){return (a.ord||0)-(b.ord||0);});
      items.forEach(function(it){if(!it.placed)bank.append(h('button',{type:'button',onclick:function(){if(answered)return;it.placed=true;it.ord=++cnt;draw();}},it.w));});
      placed.forEach(function(it){ans.append(h('button',{type:'button',onclick:function(){if(answered)return;it.placed=false;draw();}},it.w));});
    }
    var cnt=0;draw();
    var ck=h('button',{class:'btn pri',type:'button',onclick:function(){
      if(answered)return;
      var placed=items.filter(function(x){return x.placed;}).sort(function(a,b){return a.ord-b.ord;}).map(function(x){return x.w;});
      if(placed.length!==items.length){toast('Usa todas las palabras.');return;}
      var user=placed.join(' ');finish(normText(user)===normText(q.answer),user);
    }},'Comprobar');
    var clr=h('button',{class:'btn ghost',type:'button',onclick:function(){if(answered)return;items.forEach(function(x){x.placed=false;});draw();}},'Borrar');
    body.append(ans,bank,h('div',{class:'typerow'},ck,clr));
    sess.keys=null;
  }
  else if(q.kind==='speak'){
    body.append(h('div',{class:'target',id:'tgt'},q.target));
    if(q.es)body.append(h('div',{class:'heard'},q.es));
    var heard=h('div',{class:'heard',id:'heard'},'');
    var mic=h('button',{class:'btn micbtn',type:'button'},'🎤 Hablar');
    body.append(h('div',{class:'center'},
      h('button',{class:'btn',type:'button',onclick:function(){playAudio(q.model||{text:q.target});}},'🔊 Escuchar modelo'),
      h('button',{class:'btn',type:'button',onclick:function(){playAudio(q.model||{text:q.target},true);}},'🐢 Lento'),
      SR?mic:null));
    body.append(heard);
    if(!SR){
      body.append(h('div',{class:'notice'},'Tu navegador no tiene reconocimiento de voz (usa Chrome o Edge). Escucha el modelo, repítelo en voz alta y autoevalúate:'));
    }
    var self=h('div',{class:'center'},
      h('button',{class:'btn',type:'button',onclick:function(){finish(true,'autoevaluación');}},'✅ Lo dije bien'),
      h('button',{class:'btn',type:'button',onclick:function(){finish(false,'autoevaluación');}},'🔁 Aún no me sale'));
    if(SR){body.append(h('details',null,h('summary',null,'¿No funciona el micrófono? Autoevalúate'),self));}else body.append(self);
    if(SR)mic.addEventListener('click',async function(){
      if(answered)return;
      stopAll();mic.classList.add('live');mic.textContent='🎙️ Escuchando…';mic.disabled=true;heard.textContent='';
      try{
        await sleep(150);
        var alts=await listenOnce();
        var r=scoreSpeech(q.target,alts,q.accept);
        $('#tgt').innerHTML=r.marks.map(function(m){return '<span class="'+(m.ok?'w-ok':'w-bad')+'">'+m.w+'</span>';}).join(' ');
        heard.textContent='Te escuché: “'+r.heard+'”  ·  precisión '+Math.round(r.score*100)+'%';
        attempts++;
        if(r.score>=0.8){finish(true,r.heard);}
        else if(attempts>=3){finish(false,r.heard);}
        else{heard.textContent+='  ·  Inténtalo otra vez ('+attempts+'/3)';}
      }catch(err){
        var msg={'not-allowed':'Permite el micrófono en el navegador y vuelve a intentar.','service-not-allowed':'El micrófono está bloqueado para esta página.','no-speech':'No te escuché. Acércate al micrófono e inténtalo de nuevo.','network':'El reconocimiento de voz necesita conexión a Internet.','audio-capture':'No se encontró un micrófono.'}[err]||'No pude reconocer tu voz. Inténtalo otra vez.';
        heard.textContent=msg;
      }
      mic.classList.remove('live');mic.textContent='🎤 Hablar';mic.disabled=false;
    });
    sess.keys=null;
  }
}

function renderResult(){
  var v=$('#view');v.innerHTML='';

function renderExam(v){
  v.append(h('h2',null,'🎯 Examen mixto'),h('p',{class:'muted'},'Preguntas al azar de todos los temas (la pronunciación con micrófono se practica en su sección).'));
  var g=h('div',{class:'grid'});
  [[20,'Examen corto','20 preguntas'],[30,'Examen completo','30 preguntas'],[50,'Maratón','50 preguntas']].forEach(function(x){
    g.append(h('button',{type:'button',class:'card',onclick:function(){startQuiz('mixed',{title:x[1],icon:'🎯',gen:mixedGen,n:x[0],back:'exam'});}},h('span',{class:'ic'},'📝'),h('b',null,x[1]),h('span',{class:'d'},x[2]+' con listening, gramática, números, vocabulario y más.'),h('span',{class:'go'},'Empezar →')));
  });
  g.append(h('button',{type:'button',class:'card',onclick:reviewMistakes},h('span',{class:'ic'},'🔁'),h('b',null,'Repasar mis errores'),h('span',{class:'d'},S.mistakes.length+' pregunta(s) guardadas.'),h('span',{class:'go'},'Repasar →')));
  v.append(g);
}
function reviewMistakes(){
  if(!S.mistakes.length){toast('¡No tienes errores guardados! 🎉');return;}
  startQuiz('review',{list:shuffle(S.mistakes),title:'Repaso de errores',icon:'🔁',review:true,back:'progress',n:S.mistakes.length});
}
function renderProgress(v){
  v.append(h('h2',null,'📊 Tu progreso'));
  v.append(h('div',{class:'panel',html:'⭐ <b>'+S.xp+' XP</b> · Nivel <b>'+(Math.floor(S.xp/200)+1)+'</b> · 🔥 Racha actual <b>'+S.streak+'</b> · Mejor racha <b>'+S.best+'</b>'}));
  var p=h('div',{class:'panel'});
  var worst=null,wp=101;
  Object.keys(TOPICS).forEach(function(k){
    var st=S.stats[k]||{c:0,t:0},pc=st.t?Math.round(st.c/st.t*100):0;
    if(st.t>=3&&pc<wp){wp=pc;worst=k;}
    p.append(h('div',{class:'pbar'},h('span',null,TOPICS[k]),h('div',{class:'t'},h('div',{style:'width:'+pc+'%'})),h('span',null,st.t?pc+'% ('+st.c+'/'+st.t+')':'sin datos')));
  });
  v.append(p);
  if(worst)v.append(h('div',{class:'notice'},'💡 Tu tema más flojo ahora es <b>'+TOPICS[worst]+'</b> ('+wp+'%). Dedícale una prueba hoy.'.replace(/<[^>]+>/g,'')));
  v.append(h('div',{class:'center'},
    h('button',{class:'btn pri',type:'button',onclick:reviewMistakes},'🔁 Repasar errores ('+S.mistakes.length+')'),
    h('button',{class:'btn',type:'button',onclick:function(){if(confirm('¿Borrar todo tu progreso?')){S.stats={};S.xp=0;S.streak=0;S.best=0;S.mistakes=[];save();renderStats();go('progress');}}},'🗑️ Reiniciar progreso')));
  v.append(h('p',{class:'hint'},'El progreso se guarda en este navegador.'));
}

/* delegacion para elementos .say */
document.addEventListener('click',function(e){
  var t=e.target.closest&&e.target.closest('[data-say]');
  if(t)playAudio({text:t.getAttribute('data-say')});
});

function applyTheme(){
  var th=S.theme||(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
  document.documentElement.setAttribute('data-theme',th);
}
$('#themeBtn').addEventListener('click',function(){S.theme=(document.documentElement.getAttribute('data-theme')==='dark')?'light':'dark';applyTheme();save();});
$('#rate').value=S.rate;$('#rateVal').textContent=Number(S.rate).toFixed(2);
$('#rate').addEventListener('input',function(){S.rate=parseFloat(this.value)||0.9;$('#rateVal').textContent=S.rate.toFixed(2);save();});
$('#qn').value=String(S.qn);
$('#qn').addEventListener('change',function(){S.qn=parseInt(this.value,10)||10;save();});
$('#voiceSel').addEventListener('change',function(){S.voice=this.value;save();});
$('#testVoice').addEventListener('click',function(){playAudio({text:'Hello! This is your English voice. Let us practice.'});});
if(TTS){loadVoices();if(speechSynthesis.onvoiceschanged!==undefined)speechSynthesis.onvoiceschanged=loadVoices;}
else $('#voiceSel').append(h('option',null,'Sin voz disponible'));
applyTheme();renderStats();go('home');
window.__EP={QZ:QZ,checkType:checkType,scoreSpeech:scoreSpeech,normText:normText,numWords:numWords,COUNTRIES:COUNTRIES,SECTIONS:SECTIONS,EXAM_POOL:EXAM_POOL};
})();
